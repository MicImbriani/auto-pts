version: 2

models:
  - name: fact_test_result
    description: "Grain: one test case per run."
    columns:
      - name: result_sk
        tests: [unique, not_null]
      - name: run_sk
        tests: [not_null]
      - name: test_case_sk
        tests: [not_null]

  - name: dim_test_case
    columns:
      - name: test_case_sk
        tests: [unique, not_null]
      - name: name
        tests: [unique, not_null]

  - name: dim_run
    columns:
      - name: run_sk
        tests: [unique, not_null]
      - name: run_id
        tests: [unique, not_null]

  - name: dim_status
    columns:
      - name: status_sk
        tests: [unique, not_null]
      - name: status_code
        tests: [unique, not_null]
